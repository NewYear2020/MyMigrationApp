[project]
name = "migration-agent"
version = "0.1.0"
description = "SQL conversion agent for Vertica to Oracle ADW migration"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "sqlglot>=26.0.0",
    "oracledb>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "oci[oci]>=2.167.2",
    "langchain-community>=0.4.1",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
